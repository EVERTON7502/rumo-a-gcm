<meta name="theme-color" content="#050b22">

<script>try{var t=localStorage.getItem("gcm2_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
@font-face{font-family:"Inter";src:url("fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
/* Tokens (Figma "Rumo à GCM: Design System") */
:root{
 --bg:#050b22;--bg2:#0a1d5c;--bg3:#0d2a8a;
 --card:rgba(20,48,140,.42);--card2:rgba(12,30,92,.62);--inset:rgba(4,12,44,.55);
 --tx:#eef4ff;--tx2:#c3d3f7;--mu:#9db2e2;
 --ac:#3aa2ff;--ac2:#2563eb;--cy:#22d3ee;--ac-tx:#7cc4ff;
 --bd:rgba(110,170,255,.30);--bd2:rgba(124,196,255,.55);
 --ok:#22c870;--ok-tx:#3fe08e;--wa:#ffb020;--er:#ff5d7a;
 --on-ac:#fff;
 --glow:0 0 22px rgba(58,162,255,.55);--glow-ok:0 0 18px rgba(34,200,112,.55);--glow-er:0 0 18px rgba(255,93,122,.5);
 --shadow:0 10px 30px rgba(0,4,30,.45);
 --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--s6:40px;--s7:48px;
 --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:999px;
 --f-head:"Plus Jakarta Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --s-lp:#38a8ff;--s-rlm:#22d27a;--s-inf:#ff9f43;--s-dcc:#b57bff;--s-dpp:#ff5d7a;--s-adm:#22d3ee;--s-are:#f5d90a;--s-leg:#7c9cff;
 --heat0:rgba(110,170,255,.12);--heat1:#1a4fb0;--heat2:#2a78e6;--heat3:#22b8ff;--heat4:#22d27a;
 --bgimg:radial-gradient(900px 520px at 90% -10%,rgba(40,100,255,.55),transparent 65%),radial-gradient(700px 480px at -15% 30%,rgba(20,90,255,.35),transparent 65%),radial-gradient(600px 400px at 50% 110%,rgba(34,211,238,.18),transparent 70%),linear-gradient(180deg,#06123f 0%,#0a1d5c 45%,#071547 100%);
 color-scheme:dark;
}
:root[data-theme="light"]{
 --bg:#eef3ff;--bg2:#e3ebff;--bg3:#d6e2ff;
 --card:rgba(255,255,255,.88);--card2:#fff;--inset:#eef3ff;
 --tx:#0b1638;--tx2:#2c3b66;--mu:#4c5b85;--ac:#1456b8;--ac2:#1456b8;--cy:#0b6a8a;--ac-tx:#1456b8;
 --bd:rgba(20,86,184,.22);--bd2:rgba(20,86,184,.45);
 --ok:#0e7a45;--ok-tx:#0e7a45;--wa:#9a5200;--er:#b8233f;
 --glow:0 6px 18px rgba(20,86,184,.25);--glow-ok:0 6px 16px rgba(14,122,69,.25);--glow-er:0 6px 16px rgba(184,35,63,.25);
 --shadow:0 8px 24px rgba(20,40,100,.12);
 --heat0:#dfe7fb;--heat1:#a9c4f5;--heat2:#5d93e8;--heat3:#1f6fd1;--heat4:#0e7a45;
 --bgimg:radial-gradient(800px 480px at 90% -10%,rgba(58,130,255,.18),transparent 65%),linear-gradient(180deg,#f4f7ff,#e8efff);
 color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;min-height:100vh;color:var(--tx);background:var(--bg);background-image:var(--bgimg);background-attachment:fixed;font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.h{font-family:var(--f-head);margin:0;letter-spacing:-.01em}
h2{font-size:18px;line-height:24px;font-weight:700}h3{font-size:16px;line-height:22px;font-weight:650}
a{color:var(--ac-tx)}
small,.cap{font-size:13px;line-height:18px}
.mu{color:var(--mu)}.tx2{color:var(--tx2)}
.lbl{font:600 13px/18px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px;border-radius:10px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.top{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;max-width:1100px;margin:0 auto}
.logo{width:44px;height:44px;flex:none;border-radius:14px;box-shadow:var(--glow)}
.top .tt{flex:1;min-width:0}
.top h1{font-size:18px;line-height:24px;font-weight:800;background:linear-gradient(90deg,var(--tx),var(--ac-tx));-webkit-background-clip:text;background-clip:text;color:transparent}
.top #sub{display:block;color:var(--mu);font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:var(--r-pill);background:var(--card2);border:1px solid var(--bd);transition:transform .15s,box-shadow .2s}
.ib:hover{box-shadow:var(--glow)}.ib:active{transform:scale(.94)}.ib svg{width:22px;height:22px}

/* Layout */
main{max-width:1100px;margin:0 auto;padding:4px 16px 24px}
.grid{display:grid;gap:16px}
@media(min-width:760px){main{padding:8px 24px 32px}.g2{grid-template-columns:1fr 1fr}.g2 .span{grid-column:1/-1}}
@media(min-width:1024px){.g3{grid-template-columns:1.25fr 1fr}}
.stack>*+*{margin-top:16px}

/* Card (vidro) */
.card{position:relative;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*60ms)}
.card.hl{border-color:var(--bd2);box-shadow:var(--shadow),var(--glow)}
.card.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent);box-shadow:var(--shadow),0 0 18px color-mix(in srgb,var(--ok) 25%,transparent)}
.card.warn{border-color:color-mix(in srgb,var(--wa) 60%,transparent)}
.card.flat{animation:none}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}.ch h2,.ch h3{flex:1;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 24px;margin-top:12px;border:0;border-radius:var(--r-pill);background:linear-gradient(135deg,#2563eb,#22b8ff);color:#fff;font:600 16px/1.2 var(--f-body);box-shadow:0 6px 22px rgba(42,140,255,.45);transition:transform .15s,box-shadow .2s,filter .2s;text-decoration:none}
.btn:hover{box-shadow:0 8px 30px rgba(58,162,255,.7);filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#16a85c,#2fd884);box-shadow:var(--glow-ok)}
.btn.er{background:linear-gradient(135deg,#d93a5c,#ff6b86);box-shadow:var(--glow-er)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ac-tx);border:1px solid var(--bd2);box-shadow:none}
.btn.sm{width:auto;min-height:48px;padding:10px 18px;margin-top:0;font-size:14px}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1;min-width:140px}
a.l,button.l{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:8px 16px;margin:8px 8px 0 0;border:1px solid var(--bd2);border-radius:var(--r-pill);background:var(--inset);color:var(--ac-tx);text-decoration:none;font:600 14px/1 var(--f-body);transition:box-shadow .2s,transform .15s}
a.l svg,button.l svg{width:18px;height:18px;flex:none}a.l:hover,button.l:hover{box-shadow:var(--glow)}a.l:active,button.l:active{transform:scale(.96)}
:root[data-theme="light"] .btn.sec{background:#fff}

/* Chips de matéria */
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-pill);font:600 13px/18px var(--f-body);color:var(--tx);background:color-mix(in srgb,var(--c,var(--ac)) 16%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--ac)) 60%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--ac));box-shadow:0 0 8px var(--c,var(--ac))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font:700 13px/18px var(--f-body)}
.pill.ok{color:var(--ok-tx);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.pill.wa{color:var(--wa);background:color-mix(in srgb,var(--wa) 18%,transparent)}
.pill.ac{color:var(--ac-tx);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.pill.er{color:var(--er);background:color-mix(in srgb,var(--er) 18%,transparent)}

/* Próxima ação */
.next{background:linear-gradient(135deg,rgba(29,78,216,.92),rgba(14,116,190,.78));border-color:rgba(124,196,255,.7);box-shadow:var(--shadow),0 0 34px rgba(58,162,255,.45);overflow:hidden}
.next:before{content:"";position:absolute;inset:-40% -20% auto auto;width:240px;height:240px;background:radial-gradient(circle,rgba(125,211,252,.45),transparent 65%);pointer-events:none}
.next .lbl{color:#cfe6ff}.next h2{color:#fff;font-size:20px;line-height:26px;margin-top:4px}.next p{color:#e3efff;margin:6px 0 0}
.next .btn{background:#fff;color:#0b2a8a;box-shadow:0 6px 24px rgba(255,255,255,.3)}
:root[data-theme="light"] .next{background:linear-gradient(135deg,#1456b8,#1d74d8)}

/* Herói: anel + contagem */
.hero{display:flex;align-items:center;gap:16px;overflow:hidden}
.hero:before{content:"";position:absolute;left:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(58,162,255,.35),transparent 62%);pointer-events:none}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .bg{stroke:rgba(110,170,255,.18)}
.ring .p{stroke:url(#rg);stroke-dasharray:264;stroke-dashoffset:264;filter:drop-shadow(0 0 6px rgba(58,162,255,.8));animation:ringf 1.4s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ringf{to{stroke-dashoffset:var(--o)}}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .cnt{font:800 26px/1 var(--f-head)}.ring small{color:var(--mu)}
.hx{position:relative;min-width:0}
.hb{font:800 44px/1 var(--f-head);letter-spacing:-.03em;background:linear-gradient(180deg,#fff,#8ccfff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .hb{background:linear-gradient(180deg,#0b1638,#1456b8);-webkit-background-clip:text;background-clip:text}

/* Blocos de estatística */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:20px;padding:12px;min-width:0;box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*60ms)}
.tile .lbl{font-size:13px;letter-spacing:.04em}
.tile b{display:block;font:700 19px/24px var(--f-head);margin-top:4px;white-space:nowrap}
.tile svg{width:18px;height:18px;vertical-align:-3px;margin-right:2px}
@media(max-width:359px){.tile b{font-size:16px}}

/* Barras */
.bar{height:8px;border-radius:8px;background:var(--inset);overflow:hidden;margin-top:8px;border:1px solid rgba(110,170,255,.12)}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#22b8ff,#22d27a);box-shadow:0 0 12px rgba(58,162,255,.6);animation:fillw 1s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fillw{to{width:var(--w)}}
.srow{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;margin-top:14px}.srow .bar{grid-column:1/-1;margin:0}
.srow span:nth-child(2){font-weight:600;font-size:15px;line-height:20px}

/* Gráfico */
.chart{position:relative;height:170px;margin-top:8px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ln{fill:none;stroke:var(--cy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--cy));stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s .4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .bv{transform-box:fill-box;transform-origin:bottom;animation:grow .8s calc(var(--i)*70ms + 100ms) cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.chart text{fill:var(--tx2);font:600 13px var(--f-body);paint-order:stroke;stroke:rgba(6,18,66,.9);stroke-width:4px}:root[data-theme="light"] .chart text{stroke:#fff}
.chart .gl{stroke:rgba(110,170,255,.15);stroke-dasharray:3 5}

/* Mapa de constância */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.heat .wd{text-align:center;color:var(--mu);font-size:13px}
.c{aspect-ratio:1;border-radius:8px;background:var(--heat0);animation:pop .4s calc(var(--i)*14ms) ease both;position:relative}
.c.t{outline:2px solid var(--cy);outline-offset:1px}
.l1{background:var(--heat1)}.l2{background:var(--heat2)}.l3{background:var(--heat3);box-shadow:0 0 10px var(--heat3)}.l4{background:var(--heat4);box-shadow:0 0 12px var(--heat4)}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.lg{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin-top:10px;justify-content:flex-end}.lg i{width:14px;height:14px;border-radius:4px;background:var(--heat0)}

/* Matérias do dia */
.subj{border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--inset);border-radius:20px;padding:14px;margin-top:12px;animation:rise .5s both;animation-delay:calc(var(--d,0)*60ms)}
.subj.done{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 9%,var(--inset))}
.tp{margin:8px 0 0;font-size:15px;line-height:22px;color:var(--tx2)}
.steps{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.steps li{font-size:13px;line-height:18px;padding:4px 10px;border-radius:var(--r-pill);background:rgba(110,170,255,.12);color:var(--tx2)}
.steps li.on{background:color-mix(in srgb,var(--ac) 25%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd2)}
.steps li.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok-tx)}

/* Cronômetro */
.timer{text-align:center;padding:24px 16px;overflow:hidden}
.timer:before{content:"";position:absolute;left:50%;top:40%;width:320px;height:320px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(58,162,255,.28),transparent 65%);pointer-events:none}
.timer .lbl{letter-spacing:.3em;color:var(--ac-tx)}
.big{position:relative;font:300 76px/1 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:16px 0 8px;color:#fff;text-shadow:0 0 24px rgba(58,162,255,.85)}
:root[data-theme="light"] .big{color:var(--tx);text-shadow:none}
.big.run{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 14px rgba(58,162,255,.6)}50%{text-shadow:0 0 34px rgba(58,162,255,1)}}
.tbar{height:6px;border-radius:6px;background:var(--inset);margin:12px 0 4px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22d3ee);box-shadow:0 0 10px var(--cy);transition:width 1s linear}
.tctl{display:flex;justify-content:center;align-items:flex-start;gap:28px;margin-top:20px}
.rb{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font:600 14px/1 var(--f-body);color:var(--tx2)}
.rb span.o{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--bd2);transition:transform .15s,box-shadow .2s}
.rb.go span.o{width:88px;height:88px;background:radial-gradient(circle at 35% 30%,#7fd6ff,#2563eb 70%);border:0;box-shadow:0 0 0 8px rgba(58,162,255,.15),0 0 36px rgba(58,162,255,.85);animation:breathe 2.6s ease-in-out infinite}
.rb.ok span.o{background:radial-gradient(circle at 35% 30%,#6ff0a8,#12a35a 70%);border:0;box-shadow:0 0 0 6px rgba(34,200,112,.15),var(--glow-ok)}
.rb svg{width:30px;height:30px;color:#fff}.rb:not(.go):not(.ok) svg{color:var(--tx)}
.rb:active span.o{transform:scale(.93)}.rb:disabled{opacity:.45}
@keyframes breathe{0%,100%{box-shadow:0 0 0 8px rgba(58,162,255,.15),0 0 26px rgba(58,162,255,.6)}50%{box-shadow:0 0 0 14px rgba(58,162,255,.08),0 0 44px rgba(58,162,255,1)}}
.hint{min-height:22px;color:var(--mu);font-size:14px}
.hint.alert{color:var(--wa);font-weight:700}

/* Flashcard */
.fc{perspective:900px;margin-top:12px}
.fc .face{background:var(--inset);border:1px solid var(--bd2);border-radius:20px;padding:20px 16px;text-align:left;animation:flip .45s ease both}
@keyframes flip{from{opacity:0;transform:rotateX(-12deg) translateY(8px)}}
.fc .q{font:600 18px/26px var(--f-head);margin:8px 0}

/* Formulários */
label.f{display:block;font-size:14px;font-weight:600;color:var(--tx2);flex:1}
input[type=number],textarea,select{width:100%;min-height:48px;padding:12px 14px;margin-top:6px;border-radius:var(--r-md);border:1px solid var(--bd2);background:var(--inset);color:var(--tx);font:16px/1.4 var(--f-body)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ac-tx) 50%),linear-gradient(135deg,var(--ac-tx) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
select option{background:#0a1d5c;color:#fff}:root[data-theme="light"] select option{background:#fff;color:#0b1638}

/* Alternativas */
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;text-align:left;margin:8px 0 0;padding:12px 14px;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--inset);color:var(--tx);font:400 16px/1.45 var(--f-body);transition:border-color .2s,box-shadow .2s,background .2s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--bd2);box-shadow:var(--glow)}.opt:active:not(:disabled){transform:scale(.985)}
.opt .lt{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--f-body);background:rgba(110,170,255,.18);color:var(--tx)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--inset));box-shadow:var(--glow-ok)}.opt.ok .lt{background:var(--ok);color:#03210f}

"Relações Humanas e Atendimento: 1. Qualidade no atendimento: comunicação, apresentação, atenção, cortesia, interesse, presteza, eficiência, tolerância, discrição, conduta e objetividade. 2. Trabalho em equipe","Noções de Defesa Pessoal","Análise de Riscos e Gestão da Informação: 1. Planejamento de contingências: necessidade, planejamento, componentes. 2. Manejo de emergência. 3. Gerenciamento de crises. 4. Procedimentos emergenciais. 5. Discrição e segurança de informações: graus de sigilo, atributos básicos, ameaças e vulnerabilidades, comportamento do agente","Operações de Proteção e Escoltas: 1. Planejamento de proteção pessoal e de comitivas: estudos de rota, pontos sensíveis e contingências. 2. Composição de equipes, papéis e formações em deslocamentos e eventos. 3. Procedimentos de varredura. Controle de público. Resposta imediata a ameaças. 4. Condução operacional e estratégica de veículos","Segurança Física e Patrimonial de Instalações: 1. Proteção de áreas críticas. 2. Guarda de materiais sensíveis. 3. Planos de segurança de instalações: objetivos, responsabilidades e auditorias. 4. Controle de acessos: credenciamento, barreiras, procedimentos. 5. Vigilância e monitoramento. 6. Equipamentos eletrônicos de proteção. 7. Segurança corporativa estratégica. 8. Gestão de segurança patrimonial","Gestão de Incidentes Críticos e Negociação Operacional: 1. Incidente crítico, cadeia de comando e gerenciamento do cenário. 2. Estabilização, isolamentos e perímetros. 3. Comunicação operacional. 4. Noções básicas de negociação: contato, escuta ativa, redução de tensão e encaminhamentos. 5. Critérios para escalonamento e emprego de táticas de resolução","Prevenção e Combate a Incêndio: 1. Norma Regulamentadora NR 23. 2. Proteção contra incêndio. 3. Código de segurança contra incêndio, pânico e outros riscos. 4. Atuação integrada com brigada e órgãos de resposta. 5. Tipos/uso de extintores, rotas e saídas de emergência, plano de abandono e evacuação","Condutas do Socorrista: 1. Medidas de segurança do local. 2. Comunicação e transferência ao atendimento especializado. 3. Atendimento Pré-Hospitalar (APH) – Nível Básico","Serviços de Inteligência: 1. Finalidade. 2. Utilização. 3. Conceitos básicos. 4. Fontes de coleta. 5. Metodologia de produção de conhecimentos"]},

["lp", "Nas opções a seguir, a primeira oração foi reescrita de modo a dar-se a ela um caráter genérico, com a utilização da partícula se. Assinale a opção em que isso foi feito de forma gramaticalmente incorreta.", ["Todo mundo viu a morte de perto. / Viu-se a morte de perto.", "As pessoas reclamam de tudo. / Reclama-se de tudo.", "Muita gente pensa o contrário de todos. / Pensa-se o contrário de todos.", "Muitas pessoas não respeitam os horários. / Desrespeitam-se os horários.", "Todos cometem as mesmas falhas. / Comete-se as mesmas falhas."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 1. Gabarito oficial: E.", "2019"],
["lp", "A revista Veja, em 30/03/2016, publicou a seguinte manchete:\nComida desperdiçada na América Latina\nreduziria 37% da fome do mundo\nCerca de 348 mil toneladas de alimentos\nsão perdidas por dia na região.\nSobre os componentes do texto dessa manchete, assinale a afirmativa correta.", ["Se a América Latina não desperdiçasse tantos alimentos, acabaria a fome no mundo.", "A principal crítica do texto se dirige ao atraso cultural e econômico da América Latina.", "A expressão “cerca de” indica precisamente a quantidade de alimentos desperdiçada.", "Em todo o texto há a identificação clara do responsável pelo desperdício de alimentos.", "A forma verbal “reduziria” indica uma possibilidade, e não uma certeza."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 2. Gabarito oficial: E.", "2019"],
["lp", "“Muito se tem falado de conservação do meio ambiente, mas não se criou ainda a consciência de que o planeta precisa urgentemente de nossos cuidados.”\n(Brasil Escola)\nAssinale a opção que indica os termos que, nesse segmento do texto, desempenham a mesma função sintática.", ["de conservação / do meio ambiente", "de que o planeta precisa urgentemente / de nossos cuidados", "de conservação / de nossos cuidados", "de que o planeta precisa urgentemente de nossos cuidados / do meio ambiente", "de conservação / de que o planeta precisa"], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 3. Gabarito oficial: D.", "2019"],
["lp", "“Ler é importante porque leva a pessoa a ter contato com várias ideias diferentes (dos autores), adquirindo assim uma visão mais ampla do mundo e dos conflitos que envolvem a humanidade e a sociedade. Quando se tem uma visão mais ampla, se tem também mais material para formar as próprias ideias e resolver de melhor forma os próprios problemas.”\nbrunokabuki.blogspot.com/2019/\nSegundo o texto, a leitura", ["faz os autores entrarem em contato com várias ideias.", "obriga os leitores a terem uma visão mais ampla do mundo.", "torna menos compreensíveis os conflitos do mundo.", "fornece ferramentas para a formação de nossas ideias.", "minimiza os problemas que enfrentamos."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 4. Gabarito oficial: D.", "2019"],
["lp", "“Ler é importante porque leva a pessoa a ter contato com várias ideias diferentes (dos autores), adquirindo assim uma visão mais ampla do mundo e dos conflitos que envolvem a humanidade e a sociedade. Quando se tem uma visão mais ampla, se tem também mais material para formar as próprias ideias e resolver de melhor forma os próprios problemas.”\nbrunokabuki.blogspot.com/2019/\nA relação lógica entre os dois segmentos sublinhados é a de", ["simultaneidade temporal.", "causa e consequência.", "proporcionalidade.", "comparação desproporcional.", "condição."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 5. Gabarito oficial: A.", "2019"],
["lp", "Violência, participação e democracia\n“Manifestações públicas constituem um dos aspectos essenciais da vida democrática. Um regime político que é incapaz de tolerar a livre manifestação da população – inclusive a que contraria os ocupantes do poder – não pode ser considerado democrático. Historicamente, os regimes democráticos se consolidam quando a luta política deixa de ser o arriscado jogo do tudo ou nada e se institucionaliza como parte do cotidiano da sociedade.”\nFolha de São Paulo, 14/6/2014.\nEsse trecho apresenta uma série de pensamentos de caráter democrático, à exceção de um. Assinale-o.", ["A luta política não deve ter caráter radical.", "As manifestações públicas devem ser normalmente aceitas.", "O poder político deve tolerar manifestações opostas.", "A luta política não deve fazer parte do cotidiano social.", "A violência não deve ser empregada contra manifestações."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 6. Gabarito oficial: D.", "2019"],
["lp", "Um dos temas de discussão mais frequentes na atualidade é o das vantagens e desvantagens da redução da maioridade penal. Assinale a opção que apresenta um argumento que pode ser considerado desfavorável a essa redução.", ["A redução protegeria os jovens do aliciamento do tráfico, que tem recrutado menores para a prática de crimes.", "O sistema prisional brasileiro apresenta situação caótica.", "A impunidade gera o aumento da violência.", "A opinião pública brasileira apoia a redução.", "A legislação brasileira deve alinhar-se à de países desenvolvidos."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 7. Gabarito oficial: B.", "2019"],
["lp", "Assinale a opção que indica a frase em que não ocorre a relação de causa e consequência.", ["Apesar das chuvas, as ruas não amanheceram alagadas.", "Em virtude da crise, o comércio está vendendo menos.", "Muitas pessoas deixaram de viajar em função do mau tempo.", "As necessidades econômicas geram muitos problemas.", "A violência resulta, muitas vezes, da ignorância."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 8. Gabarito oficial: A.", "2019"],

["lp", "Em 18 de novembro de 2011, o jornal A Tarde publicou a seguinte manchete: “‘Babas’ roubam espaço de banhistas na orla de Salvador”. Sobre os componentes da manchete, assinale a afirmativa incorreta.", ["O emprego do verbo “roubar” mostra uma visão negativa da ação praticada.", "A linguagem utilizada mostra traços de coloquialidade.", "A mensagem traz implícita a ideia de que os banhistas têm direito a certo espaço na orla.", "O vocábulo ‘babas’ traz aspas para indicar um sentido diferente do usual.", "A manchete é construída de forma não opinativa, como recomenda a informação jornalística."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 11. Gabarito oficial: E.", "2019"],

["lp", "“A ideia de que a natureza existe para servir o homem seria apenas ingênua, se não fosse perigosamente pretensiosa. Essa crença lançou raízes profundas no espírito humano, reforçada por doutrinas que situam corretamente o Homo Sapiens no ponto mais alto da evolução, mas incidem no equívoco de fazer dele uma espécie de finalidade da criação. Pode-se dizer com segurança que nada na natureza foi feito para alguma coisa, mas pode-se crer em permuta e equilíbrio entre seres e coisas”. Lisboa, Luiz Carlos, Olhos de ver; ouvidos de ouvir. Ed. DIFEL. 2013. As opções a seguir apresentam uma série de palavras e expressões do campo semântico da religiosidade, à exceção de uma. Assinale-a.", ["Olhos de ver; ouvidos de ouvir.", "Essa crença lançou raízes profundas.", "... uma espécie de finalidade da criação.", "... reforçada por doutrinas.", "... nada na natureza foi feito para alguma coisa."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 14. Gabarito oficial: E.", "2019"],

["leg", "João, servidor público estável do Município de Salvador, ocupava o cargo de provimento efetivo X. Após regular aprovação em concurso público, passou a ocupar o cargo Y. Ocorre que o cargo Y estava vago em razão da demissão de Pedro, que voltou a ocupá-lo por força de decisão judicial. Em razão desse estado de coisas, foi determinado o retorno de João ao cargo inicialmente ocupado, que ainda estava vago. Considerando a sistemática da Lei Complementar nº 1/1999 do Município de Salvador, esse retorno é denominado de", ["aproveitamento.", "reintegração.", "reversão.", "recondução.", "remoção."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 33. Gabarito oficial: D.", "2019"],
["leg", "Em razão das férias de Pedro, ocupante de cargo em comissão no Município de Salvador, Maria, também servidora, precisou substituí-lo por 10 (dez) dias consecutivos. À luz da Lei Complementar nº 1/1999 do Município de Salvador, é correto afirmar que uma substituição dessa natureza", ["não dá direito ao recebimento de qualquer diferença remuneratória.", "somente daria direito ao recebimento de diferença remuneratória caso a substituição alcançasse 30 dias consecutivos.", "somente daria direito ao recebimento de diferença remuneratória caso a substituição alcançasse 15 dias.", "dá direito ao recebimento da diferença remuneratória, pois se estendeu por 10 dias consecutivos.", "dá direito ao recebimento da diferença remuneratória, caso Pedro concorde, pois será descontado do respectivo valor."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 34. Gabarito oficial: D.", "2019"],
["leg", "João, servidor público do Município de Salvador, ao receber o contracheque do mês, constatou que, além de receber seu vencimento regular, também recebera (I) indenizações; (II) auxílios; (III) gratificações; e (IV) adicionais. Considerando a sistemática estabelecida pela Lei Complementar nº 1/1999 do Município de Salvador, é correto afirmar que podem ser incorporadas ao vencimento, nos casos e condições fixados em lei, as parcelas referidas em", ["I, II e III, somente.", "I e IV, somente.", "II, III e IV, somente.", "III e IV, somente.", "I e II, somente."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 35. Gabarito oficial: D.", "2019"],
["leg", "Antônio acumulava dois cargos de provimento efetivo no Município de Salvador, não se enquadrando nas situações de acumulação lícita previstas na Constituição da República Federativa do Brasil de 1988. À luz da disciplina estabelecida pela Lei Complementar nº 1/1999 do Município de Salvador, é correto afirmar que, apurada a acumulação proibida em processo administrativo, Antônio", ["perderá ambos os cargos em qualquer caso, mas não precisará restituir os valores recebidos.", "permanecerá em ambos os cargos caso já tenha decorrido o prazo de 5 anos desde a última investidura.", "perderá os cargos que venha exercendo e restituirá os valores recebidos irregularmente apenas se estiver de má-fé.", "perderá apenas o cargo que assumiu por último, desde que demonstrada a sua boa-fé.", "poderá optar, em qualquer caso, por um dos cargos em qualquer caso, não precisando restituir os valores recebidos."], 2, "Prova oficial GCM Salvador 2019 (FGV), questão 36. Gabarito oficial: C.", "2019"],
["leg", "A autoridade competente, preocupada com o estado de saúde de Joaquim, servidor público do Município de Salvador, determinou que ele se submetesse a inspeção médica. Joaquim, no entanto, negou-se a cumprir essa determinação injustificadamente. Em razão do ocorrido, foi determinada a instauração de processo administrativo disciplinar, que comprovou a plena veracidade da narrativa acima. Considerando os termos da Lei Complementar nº 1/1999 do Município de Salvador, é correto afirmar que Joaquim pode sofrer a sanção disciplinar de", ["disponibilidade.", "advertência.", "suspensão.", "demissão.", "censura."], 2, "Prova oficial GCM Salvador 2019 (FGV), questão 37. Gabarito oficial: C.", "2019"],
["leg", "Maria, vereadora recém-eleita para a Câmara Municipal de Salvador, consultou sua assessoria sobre a natureza da norma que detalharia a forma de realização da eleição da Mesa da respectiva Casa Legislativa. A assessoria, com base no que dispõe a Lei Orgânica do Município de Salvador, respondeu corretamente que essa norma é", ["o regimento interno, cuja elaboração compete privativamente à Câmara Municipal.", "uma lei ordinária, de iniciativa privativa do Prefeito Municipal, a ser aprovada pela Câmara Municipal.", "uma lei complementar, de iniciativa privativa do Prefeito Municipal, a ser aprovada pela Câmara Municipal.", "um decreto legislativo, a ser aprovado pela Câmara Municipal.", "uma medida provisória, a ser editada privativamente pelo Prefeito Municipal, com posterior aprovação do Legislativo."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 38. Gabarito oficial: A.", "2019"],
["leg", "Alberto, vereador no Município de Salvador, durante passeata realizada pelas ruas do Município, atribuiu a prática de crime ao vereador Bruno, em situação relacionada ao exercício da função. Com isso, ofendeu a honra deste último em público. Considerando o disposto na Lei Orgânica do Município de Salvador, é correto afirmar que o vereador Alberto", ["pode ser responsabilizado pelo vereador Bruno, pois a atribuição de crime é proibida pela ordem jurídica.", "pode ser responsabilizado por Bruno, o que pressupõe que a Câmara, previamente, afaste a sua imunidade.", "pode ser responsabilizado por Bruno, pois só seria inviolável por opiniões, palavras e votos proferidos na Câmara.", "não pode ser responsabilizado, pois vereadores não podem ser acusados da prática de atos ilícitos.", "não pode ser responsabilizado pelo vereador Bruno, pois é inviolável, nesse caso, por suas opiniões, palavras e votos."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 39. Gabarito oficial: E.", "2019"],
["leg", "Após ampla discussão, a Câmara Municipal de Salvador aprovou o projeto de lei nº X1, o qual veio a ser vetado pelo Prefeito Municipal sob o fundamento de ser inconstitucional. À luz da sistemática estabelecida na Lei Orgânica do Município de Salvador, é correto afirmar que o veto do Prefeito Municipal somente pode ser rejeitado", ["pelo sucessor do Prefeito.", "pela Câmara Municipal.", "pelo Poder Judiciário.", "pelo próprio Prefeito.", "pelo Ministério Público."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 40. Gabarito oficial: B.", "2019"],
["are", "De acordo com a doutrina de Direito Administrativo, em matéria de poderes administrativos, destaca-se o poder de polícia, que muito é utilizado para embasar os atos praticados por servidores ocupantes do cargo efetivo de Guarda Civil Municipal de Salvador. Tal poder pode ser conceituado como a prerrogativa de direito público que, calcada na lei, autoriza", ["a Administração Pública, por meio do Poder Executivo, a editar leis complementares dispondo sobre o funcionamento das forças de segurança pública em nível municipal.", "o Poder Executivo a determinar o confisco de bens de origem ilícita adquiridos por pessoas que cometeram crimes contra a Administração Pública.", "a Administração Pública a restringir o uso e o gozo da liberdade e da propriedade em favor do interesse da coletividade.", "a Guarda Municipal a proceder à prisão-captura de suspeitos de crimes hediondos, mesmo sem situação de flagrante ou ordem judicial.", "a Guarda Municipal a realizar diligências de busca e apreensão na casa dos investigados, independentemente de autorização judicial."], 2, "Prova oficial GCM Salvador 2019 (FGV), questão 41. Gabarito oficial: C.", "2019"],
["are", "Em relação aos bens públicos municipais do Município de Salvador, de acordo com o Código Civil e a doutrina de Direito Administrativo, assinale a opção que apresenta exemplos de bens de uso especial.", ["Correios e garagem de veículos de transporte coletivo privado.", "Postos de saúde, creches e cemitérios municipais.", "Estabelecimentos privados que prestam serviços de educação.", "Praças, estradas e ruas municipais.", "Lagoas, rios e mares que banham a cidade."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 42. Gabarito oficial: B.", "2019"],
["are", "O servidor público ocupante do cargo de Guarda Civil Municipal de Salvador, no dia a dia do exercício de suas funções, exerce diversas atividades, como executar segurança ostensiva, preventiva, uniformizada e aparelhada na proteção à população, bens, serviços e instalações do Município. Para tal, esses servidores públicos praticam alguns atos administrativos com o atributo da autoexecutoriedade, que consiste em", ["ser cogente, obrigando todos que se encontrem em seu círculo de incidência, ainda que o objetivo a ser por eles alcançado contrarie interesses privados ou públicos.", "ser de observância e execução vinculantes a todos os administrados, tão logo haja a intimação pessoal das pessoas que tiverem sua esfera jurídica afetada pelos atos.", "viabilizar a execução dos atos pela autoridade administrativa por motivos de conveniência e oportunidade, por serem atos vinculados e obrigatórios.", "trazerem em si, quando praticados os atos, a presunção de legitimidade, ou seja, a presunção de que nasceram em conformidade com as devidas normas legais.", "poder ser o ato, tão logo praticado, em regra, imediatamente executado, e seu objeto imediatamente alcançado, sem prévia intervenção do Poder Judiciário."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 43. Gabarito oficial: E.", "2019"],
["are", "O Código Civil conceitua que são públicos os bens do domínio nacional pertencentes às pessoas jurídicas de direito público interno; todos os outros são particulares, seja qual for a pessoa a que pertencerem. Neste sentido, o mesmo diploma legal estabelece que o uso comum dos bens públicos", ["deve ser necessariamente retribuído, por meio de tarifa por parte dos particulares usuários.", "deve ser necessariamente gratuito, já que tais bens pertencem a toda a sociedade de forma genérica.", "deve ser necessariamente oneroso, a fim de que toda a coletividade se beneficie.", "pode ser gratuito ou retribuído, conforme decidir arbitrariamente o Secretário Municipal de Governo.", "pode ser gratuito ou retribuído, conforme for estabelecido legalmente pela entidade a cuja administração pertencerem."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 44. Gabarito oficial: E.", "2019"],
["are", "Mário, Guarda Civil Municipal de Salvador, exerce o cargo de chefe de determinado departamento da Guarda Civil. No regular exercício de suas funções, Mário determinou à dupla de guardas civis João e Maria que, naquele dia, atuassem exclusivamente na segurança do cidadão nos órgãos e entidades da Administração Municipal, em instalações externas e na via pública X. No caso em tela, Mário pôde avaliar a conveniência e a oportunidade da prática do ato administrativo, ao escolher qual atividade seria desenvolvida pelos servidores naquele dia. De acordo com a doutrina de Direito Administrativo, em matéria de classificação dos atos administrativos quanto ao critério da liberdade de ação, Mário praticou um ato administrativo", ["arbitrário", "discricionário.", "de polícia.", "regulador.", "disciplinar."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 45. Gabarito oficial: B.", "2019"],
["dcc", "Ednaldo, servidor público, após preencher todos os requisitos exigidos para a aposentadoria por tempo de serviço, requereu o deferimento do benefício junto ao órgão competente, instruindo o requerimento com todos os documentos exigidos pela legislação de regência. O requerimento, no entanto, foi indeferido de modo ilegal e arbitrário. No dia em que tomou conhecimento do indeferimento, Ednaldo solicitou que seu advogado ingressasse com a ação constitucional cabível, de modo que pudesse obter o benefício. À luz da sistemática constitucional, é correto afirmar que a referida ação é o", ["Mandado de Segurança.", "Mandado de Injunção.", "Direito de Petição.", "Habeas Corpus.", "Habeas Data."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 46. Gabarito oficial: A.", "2019"],
["dcc", "Enquanto Pedro estava praticando um crime de furto em um carro localizado na rua, Antônio, que morava na casa da frente, contatou o seu advogado e perguntou quem poderia prendê-lo. À luz da sistemática afeta aos direitos e garantias constitucionais, o advogado respondeu corretamente que, naquele instante, Pedro", ["apenas poderia ser preso por ordem do Delegado de Polícia.", "apenas poderia ser preso pelo proprietário do veículo.", "apenas poderia ser preso se houvesse ordem judicial.", "poderia ser preso por qualquer do povo.", "apenas poderia ser preso pela polícia."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 47. Gabarito oficial: D.", "2019"],
["dcc", "Maria, prefeita municipal recém-empossada, solicitou que sua assessoria jurídica esclarecesse quais seriam as providências necessárias para a aquisição de certos bens que seriam utilizados pelas repartições públicas municipais. Sobre o caso apresentado, à luz da sistemática constitucional, assinale a afirmativa correta.", ["A contratação jamais deveria ser antecedida de licitação.", "A contratação sempre deveria ser antecedida de licitação.", "A contratação deveria ser antecedida de licitação, ressalvada autorização do Governador do Estado.", "A contratação, ressalvados os casos previstos na legislação, deveria ser antecedida de licitação.", "A contratação poderia ser antecedida de licitação se, na avaliação de Maria, fosse mais vantajoso."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 48. Gabarito oficial: D.", "2019"],
["dcc", "João, servidor público ocupante do cargo de provimento efetivo de engenheiro de radiação, desejava realizar um novo concurso público, de modo a vir a ocupar dois cargos de provimento efetivo, caso houvesse compatibilidade de horários. À luz da sistemática constitucional, assinale a afirmativa correta.", ["João não pode ocupar outro cargo de provimento efetivo.", "João somente pode vir a ocupar um cargo de professor.", "João somente pode vir a ocupar um cargo técnico.", "João pode vir a ocupar um cargo de professor ou de técnico.", "João pode vir a ocupar um cargo na área de saúde."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 49. Gabarito oficial: B.", "2019"],
["dcc", "O Prefeito do Município Beta foi comunicado da subtração de diversos computadores instalados em uma repartição do Município, o que o levou a requisitar a instauração de uma investigação penal pela Guarda Municipal, com o objetivo de identificar os criminosos. À luz da sistemática constitucional, é correto afirmar que a Guarda Municipal", ["somente está autorizada a investigar crimes praticados contra bens, serviços e instalações do Município, a exemplo daquele referido pelo Prefeito.", "não está autorizada a investigar nenhuma espécie de crime, incluindo aquele informado pelo Prefeito.", "somente está autorizada a investigar o crime referido pelo Prefeito caso seja autorizada pelo Governador do Estado.", "está autorizada a realizar a investigação de qualquer crime, incluindo aquele informado pelo Prefeito.", "somente está autorizada a investigar o crime referido pelo Prefeito caso seja autorizada pela Polícia Judiciária."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 50. Gabarito oficial: B.", "2019"],
["dpp", "Carlos, guarda municipal, durante seu horário de trabalho, verifica que Joana, declarando-se vendedora de roupas, aproxima-se de Marta e passa a lhe mostrar as saias que teria para venda. Enquanto Marta analisava as roupas apresentadas, Joana, aproveitando-se da situação criada, pega o telefone celular de Marta, que estava em cima do banco. Em seguida, Joana tenta deixar o local dos fatos, levando o telefone e as saias, pois, na verdade, não era vendedora, mas vem a ser presa em flagrante por Carlos. Encaminhada à Delegacia e confirmados os fatos, Joana deverá ser responsabilizada pelo crime de", ["furto simples.", "furto mediante fraude.", "estelionato simples.", "apropriação indébita simples.", "apropriação indébita majorada pela fraude."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 51. Gabarito oficial: B.", "2019"],
["dpp", "Rogério, funcionário público municipal, no exercício de cargo em comissão, por ser pessoa de confiança dentro da estrutura da Administração Pública Direta, subtraiu, fora do horário de serviço, o laptop da repartição em que trabalhava. Para tanto, ele contou com a ajuda do primo João, que não tinha qualquer vínculo com o Poder Público, mas que, certamente, tinha conhecimento do cargo que Rogério exercia e da facilidade que teriam em razão do acesso ao local dos fatos. Ocorre que a conduta dos primos foi registrada pelas câmeras de segurança, sendo as imagens encaminhadas para a autoridade policial. Com base apenas nas informações narradas, é correto afirmar que a conduta de Rogério configura crime de", ["peculato, sendo aplicável a ele causa de aumento de pena, em razão do cargo em comissão que exercia, respondendo João também pelo crime contra Administração Pública, apesar de este ser classificado como próprio.", "peculato simples, sem qualquer causa de aumento, já que o exercício de função de confiança é inerente à definição de funcionário público, respondendo João também pelo crime contra a Administração Pública, apesar da natureza própria do delito.", "peculato simples, sem qualquer causa de aumento, já que o exercício de função de confiança é inerente à definição de funcionário público, respondendo João pelo crime de furto, diante da natureza própria do delito.", "peculato, sendo aplicável a ele causa de aumento de pena em razão do cargo em comissão que exercia, respondendo João, porém, pelo crime de furto, diante da natureza própria do delito.", "furto qualificado pelo concurso de agentes, assim como João, já que os fatos ocorreram fora do horário de serviço."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 52. Gabarito oficial: A.", "2019"],
["dpp", "Enquanto Larissa estudava para prova de concurso público, Tatiana, sua vizinha, realizava uma festa em sua residência, com música em alto volume. Incomodada com o barulho que vinha da casa da vizinha, Larissa se dirigiu ao local para reclamar, iniciando-se uma intensa discussão. Durante a discussão, Tatiana se alterou e jogou a garrafa de cerveja que segurava em sua mão na direção dos braços de Larissa, com a intenção de causar-lhe lesão. Larissa se abaixou e a garrafa acabou atingindo sua cabeça, causando-lhe grave ferimento, que, embora não gerasse risco à sua vida, fez com que ficasse internada no hospital por dois meses. Descobertos os fatos, Tatiana deverá ser indiciada pela prática do(s) crime(s) de", ["tentativa de homicídio culposo, apenas.", "lesão corporal de natureza gravíssima e tentativa de homicídio doloso, em razão do dolo eventual.", "tentativa de homicídio doloso, apenas, absorvendo o crime de lesão corporal, em razão do dolo direto de segundo grau, porque, embora não desejasse o resultado, assumiu seu risco com sua conduta.", "lesão corporal de natureza leve, apenas, pois a vida de Larissa não foi colocada em risco.", "lesão corporal de natureza grave, apenas, em razão da incapacidade de Larissa para exercer suas ocupações habituais durante o período de internação."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 53. Gabarito oficial: E.", "2019"],
["are", "Antônio, para desviar de um caminhão que bloqueava a rua, decidiu passar com seu carro sobre a calçada, vindo, porém, a atropelar Joaquim, que saía da portaria de seu prédio para caminhar. Após ajudar a vítima a se levantar e constatar a natureza leve dos ferimentos por ela sofridos, Antônio comunicou por telefone o ocorrido a uma autoridade policial e acionou uma ambulância para prestar o socorro, seguindo seu caminho antes que as autoridades chegassem ao local, pois teria que buscar sua filha na escola. Considerando as informações narradas, é correto afirmar que Antônio", ["responderá pelo crime de omissão de socorro previsto no Código de Trânsito Brasileiro, pois não prestou diretamente socorro à vítima, em concurso com o crime de lesão corporal culposa praticada na direção de veículo automotor de natureza simples.", "não responderá por crime previsto no Código Brasileiro de Trânsito, pois, apesar da violação do dever objetivo de cuidado, o fato foi praticado sobre a calçada, e não na via de tráfego, como exige esse diploma legal.", "responderá por crime de lesão corporal culposa praticada na direção de veículo automotor, podendo ter sua pena aumentada em razão de o fato ter sido praticado sobre a calçada.", "responderá pelo crime de tentativa de homicídio culposo praticado na direção de veículo automotor, com a causa de aumento por não ter prestado socorro à vítima.", "poderá ter sua habilitação suspensa por um período de até 10 anos, caso seja condenado por crime previsto no Código de Trânsito Brasileiro."], 2, "Prova oficial GCM Salvador 2019 (FGV), questão 54. Gabarito oficial: C.", "2019"],
["leg", "De acordo com as previsões da Lei de Armas (Lei nº 10.826/03), analise as afirmativas a seguir.\nI. A posse isolada de grande quantidade de munições de uso permitido, em desacordo com as determinações legais ou regulamentares, quando desacompanhada da apreensão de arma de fogo, não constitui crime.\nII. A cessão, mesmo que gratuita, de arma de fogo de uso restrito, sem autorização ou em desacordo com a determinação legal ou regulamentar, configura crime, punido com a mesma sanção penal daquele que transporta arma de fogo de calibre permitido com numeração suprimida.\nIII. O crime de disparo de arma de fogo é expressamente subsidiário, somente havendo punição do agente caso a finalidade com o disparo não seja praticar outro crime. Está correto o que se afirma em", ["I, apenas.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, II e III."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 55. Gabarito oficial: D.", "2019"],
["dcc", "Fernanda dirigia um automóvel acompanhada de seu cônjuge, Marcelo, quando colidiu frontalmente com outro veículo. Em razão da gravidade do acidente, ambos faleceram antes mesmo de chegar o auxílio médico. Sobre a situação apresentada, segundo o Código Civil, assinale a afirmativa correta.", ["Houve a morte presumida de ambos.", "Será necessária a decretação de ausência de Fernanda e Marcelo.", "Como ambos morreram em razão do mesmo acidente, presume-se que o de maior idade faleceu primeiro.", "Diante do falecimento em uma mesma ocasião, ocorre a comoriência.", "Não há norma no ordenamento brasileiro a respeito de morte simultânea."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 56. Gabarito oficial: D.", "2019"],
["dcc", "Walter é praticante de alpinismo e faz escaladas em encostas de grande altura pelo Brasil. Ao praticar esta atividade em Brotas, as cordas que seguravam Walter acabaram não suportando o peso de seu corpo e ele caiu, chocando a coluna contra uma pedra. Durante a internação, o médico, em contato com a família, explicou que Walter encontrava-se em coma, com todas as funções vitais ativas, e também o sistema nervoso. No entanto, advertiu seus parentes que a possibilidade de falecimento era grande e que, no mínimo, certamente a lesão o deixará paraplégico. Quanto à situação de Walter, conforme o Código Civil, assinale a afirmativa correta.", ["Ocorreu sua morte jurídica.", "Houve sua morte presumida.", "Encontra-se, por causa transitória, absolutamente incapaz.", "Encontra-se plenamente capaz, em razão da atividade de seu sistema nervoso.", "Manterá a capacidade relativa, enquanto estiver em coma."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 57. Gabarito oficial: E.", "2019"],
["dcc", "Um determinado prédio histórico de Salvador passa por reformas. Para tanto, são retiradas algumas de suas janelas e partes do piso de algumas áreas. Após determinados procedimentos, tais materiais serão reintegrados ao imóvel. Segundo o Código Civil, essas janelas e partes do piso são bens", ["móveis.", "imóveis.", "consumíveis.", "imóveis, mas, durante o período de retirada, móveis.", "coletivos."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 58. Gabarito oficial: B.", "2019"],
["dcc", "A concessionária WYZ instalou algumas torres em imóvel concedido pelo Estado, as quais têm utilidade de transmitir energia para as residências de determinado bairro. A energia transmitida, segundo o que dispõe o Código Civil, é considerada", ["bem móvel.", "bem dominical.", "bem acessório às torres.", "bem público de uso comum.", "bem imóvel."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 59. Gabarito oficial: A.", "2019"],
["dcc", "Gilberto, divorciado, pai de três filhos, faleceu aos 81 anos, deixando três imóveis e dois veículos. Segundo o Código Civil,", ["apenas os imóveis, individualmente considerados, são bens imóveis, diferentemente da totalidade do patrimônio do falecido.", "todos os bens do patrimônio do falecido, inclusive os imóveis, são considerados bens fungíveis.", "não se considera o patrimônio total do falecido uma universalidade de direitos dotada de valor econômico.", "o direito à sucessão aberta, atribuído aos herdeiros de Gilberto em relação à universalidade de patrimônio deste, é considerado bem imóvel.", "não se pode dizer que os imóveis, considerados em si, são bens singulares."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 60. Gabarito oficial: D.", "2019"],
["are", "O Sistema Nacional de Trânsito é composto por diferentes órgãos e entidades, que possuem competências diversas. Assinale a opção que apresenta uma competência dos órgãos e entidades executivos de trânsito dos municípios.", ["Implantar, manter e operar o sistema de sinalização, os dispositivos e os equipamentos de controle viário.", "Expedir e cassar Carteira Nacional de Habilitação.", "Expedir o Certificado de Registro e o Licenciamento Anual de veículos.", "Comunicar ao órgão executivo da União a suspensão e a cassação do direito de dirigir.", "Julgar os recursos interpostos por infratores de trânsito."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 61. Gabarito oficial: A.", "2019"],
["are", "Com relação à obrigatoriedade de expedição de um novo Certificado de Registro para um Veículo (CRV), analise as afirmativas a seguir.\nI. É necessária a expedição de novo CRV quando for alterada qualquer característica do veículo.\nII. No caso de transferência de propriedade do veículo, o prazo para o proprietário adotar as providências necessárias para efetivação de novo CRV é de 45 dias.\nIII. Para a expedição de novo CRV, é exigido o Certificado de Licenciamento Anual do veículo. Está correto o que se afirma em", ["I, apenas.", "II, apenas.", "III, apenas.", "II e III, apenas.", "I e III, apenas."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 62. Gabarito oficial: E.", "2019"],
["are", "Um condutor possui 25 anos e está habilitado há dois anos na categoria B. Além disso, não cometeu nenhuma infração grave ou gravíssima, nem é reincidente em infrações médias nos últimos 12 meses. Nesse caso, esse condutor, mediante também aprovação em curso especializado e em curso de treinamento de prática veicular em situação de risco, pode habilitar-se", ["à categoria C, somente.", "à categoria D, somente.", "às categorias C e D, somente.", "às categorias C e E, somente.", "às categorias D e E, somente."], 2, "Prova oficial GCM Salvador 2019 (FGV), questão 63. Gabarito oficial: C.", "2019"],
["are", "As opções a seguir apresentam alguns crimes de trânsito dispostos no Código de Trânsito Brasileiro, à exceção de uma. Assinale-a.", ["Entregar a direção de veículo automotor a pessoa não habilitada.", "Deixar o condutor do veículo, na ocasião do acidente, de prestar imediato socorro à vítima.", "Trafegar em velocidade incompatível com a segurança nas proximidades de hospitais, gerando perigo de dano.", "Dirigir sob a influência de álcool em qualquer quantidade no sangue, mesmo sem sinais que indiquem alteração da capacidade psicomotora.", "Participar, na direção de veículo automotor, de disputa automobilística não autorizada pela autoridade competente."], 3, "Prova oficial GCM Salvador 2019 (FGV), questão 64. Gabarito oficial: D.", "2019"],
["are", "As figuras a seguir apresentam um sinal de advertência (1) e um sinal de regulamentação (2).\n(1) (2)\n(Figura 1: sinal de advertência amarelo em losango. Figura 2: sinal circular de regulamentação com “10 t” e seta para baixo.)\nOs sinais (1) e (2) indicam, respectivamente:", ["Ponte estreita e Peso bruto total máximo permitido.", "Ponte estreita e Peso máximo por eixo.", "Estreitamento de pista ao centro e Tara máxima permitida.", "Estreitamento de pista ao centro e Peso bruto total máximo permitido.", "Estreitamento de pista ao centro e Peso máximo por eixo."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 65. Gabarito oficial: A. Questão com quadro ou figura: confira a imagem na prova original.", "2019"],
["leg", "Após ampla movimentação popular, as autoridades competentes decidiram que a Guarda Municipal de Salvador atuaria de modo concorrente com o órgão de trânsito estadual no exercício de suas competências de trânsito. De acordo com a sistemática estabelecida pela Lei Federal nº 13.022/14, é correto afirmar que a referida atuação concorrente", ["pressupõe a edição de lei estadual autorizando-a.", "é vedada.", "pressupõe a edição de lei municipal autorizando-a.", "pode ser livremente realizada.", "pressupõe a celebração de convênio."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 66. Gabarito oficial: E.", "2019"],
["leg", "Joana, estudante de direito, realizou intensa pesquisa a respeito das características da Guarda Municipal de Salvador, de sua posição na estrutura do Poder Executivo e de seu comando. Considerando os termos da Lei nº 9.070/16, do Município de Salvador, Joana concluiu corretamente que a Guarda Municipal tem a natureza de", ["autarquia pública, está vinculada à Secretaria Municipal de Ordem Pública e é comandada por um Inspetor Geral.", "superintendência, está vinculada à Secretaria de Segurança Urbana e Prevenção à Violência e é comandada por um Inspetor Geral.", "autarquia pública, está vinculada à Superintendência de Ordem Pública e é comandada pelo Prefeito Municipal.", "superintendência, está vinculada à Secretaria Municipal de Ordem Pública e é comandada por um Inspetor Geral.", "autarquia pública, está vinculada à Secretaria de Segurança Urbana e Prevenção à Violência e é comandada pelo Prefeito Municipal."], 0, "Prova oficial GCM Salvador 2019 (FGV), questão 67. Gabarito oficial: A.", "2019"],
["leg", "Pedro, Guarda Municipal de Salvador, foi informado por um colega que sua chefia imediata determinara que diversos Guardas Municipais, inclusive ele, fossem deslocados para uma área de proteção ambiental instituída pelo Município de Salvador. O deslocamento se justificava pela notícia de que populares ameaçavam invadir o local para instalar um acampamento para pessoas desabrigadas. De acordo com a sistemática estabelecida pela Lei Federal nº 13.022/14, é correto afirmar que a tarefa atribuída a Pedro é", ["ilegal, pois a Guarda Municipal não se destina à proteção do meio ambiente.", "legal, pois a Guarda Municipal deve proteger o patrimônio ambiental do Município.", "ilegal, salvo se a Guarda Municipal atuar em apoio das autoridades estaduais competentes.", "legal, pois a Guarda municipal está vocacionada à proteção do meio ambiente, qualquer que seja o nível federativo.", "ilegal, salvo se a Guarda Municipal atuar em apoio às autoridades federais competentes."], 1, "Prova oficial GCM Salvador 2019 (FGV), questão 68. Gabarito oficial: B.", "2019"],
["leg", "Maria e João, Guardas Municipais de Salvador, constataram que Ana estava furtando objetos da banca de um vendedor ambulante. De acordo com a sistemática estabelecida pela Lei Federal nº 13.022/14, é correto afirmar que Maria e João", ["podem prender Ana, devendo encaminhá-la à sede da Guarda Municipal.", "devem solicitar a Ana que se apresente à Polícia Judiciária.", "devem comunicar ao ambulante, para que este cumpra o seu dever de prender Ana.", "devem se reportar ao seu superior hierárquico, para que este adote providências em relação a Ana.", "podem prender Ana, devendo encaminhá-la ao Delegado de Polícia."], 4, "Prova oficial GCM Salvador 2019 (FGV), questão 70. Gabarito oficial: E.", "2019"]];

const FC={"lp0":[["Fale em voz alta tudo o que você lembra deste assunto","Identifique tese, argumentos e conclusão. Separe fato de opinião e inferência (o que o texto permite concluir) de extrapolação (o que ele não diz). Tipos de argumento: autoridade, exemplificação, causa e consequência, comparação, dados. A FGV costuma perguntar a função de um trecho, o que se pode concluir e qual a relação entre as ideias."],["Tipos de argumento?","autoridade, exemplificação, causa e consequência, comparação, dados"]],"lp1":[["Fale em voz alta tudo o que você lembra deste assunto","Tipos textuais: narração, descrição, dissertação (expositiva e argumentativa) e injunção. Gêneros: notícia, crônica, artigo de opinião, ofício. Parágrafo: tópico frasal, desenvolvimento e fecho. Observe como o autor organiza as ideias, usa citação, paráfrase e exemplos."],["Tipos textuais?","narração, descrição, dissertação (expositiva e argumentativa) e injunção"],["Gêneros?","notícia, crônica, artigo de opinião, ofício"],["Parágrafo?","tópico frasal, desenvolvimento e fecho"]],"lp2":[["Fale em voz alta tudo o que você lembra deste assunto","Progressão é o avanço do texto com informação nova apoiada no que já foi dito. Ocorre por retomadas (pronomes, sinônimos), conectores e encadeamento lógico. Textos sem progressão ficam circulares ou repetitivos."]],"lp3":[["Fale em voz alta tudo o que você lembra deste assunto","Coesão: ligação formal entre partes (referencial: pronomes, sinônimos, elipse; sequencial: conjunções, advérbios). Coerência: sentido lógico, sem contradição. Intertextualidade: diálogo entre textos (citação, paráfrase, paródia, alusão). Um texto pode ser coeso e incoerente."],["Coesão?","ligação formal entre partes (referencial: pronomes, sinônimos, elipse; sequencial: conjunções, advérbios)"],["Coerência?","sentido lógico, sem contradição"],["Intertextualidade?","diálogo entre textos (citação, paráfrase, paródia, alusão)"]],"lp4":[["Fale em voz alta tudo o que você lembra deste assunto","Reescrever mantendo o sentido: troque conectivos por equivalentes (mas = porém), passe voz ativa para passiva, desloque termos e cuidado com pontuação, concordância, regência e crase. Questões pedem a opção que mantém o sentido original sem erro gramatical."],["Reescrever mantendo o sentido?","troque conectivos por equivalentes (mas = porém), passe voz ativa para passiva, desloque termos e cuidado com pontuação, concordância, regência e crase"]],"lp5":[["Fale em voz alta tudo o que você lembra deste assunto","Sentido da palavra no contexto, sinonímia, antonímia, homonímia, paronímia (infringir/infligir, descriminar/discriminar, emergir/imergir) e polissemia. Sempre confira o significado pela frase, não pela palavra isolada."]],"lp6":[["Fale em voz alta tudo o que você lembra deste assunto","Estrangeirismos: palavras de outras línguas incorporadas ao português (abajur, de abat-jour; delivery, shopping). Podem ser aportuguesados ou mantidos na grafia original (em itálico). Entenda neologismo, empréstimo e a discussão sobre seu uso e adequação."],["Estrangeirismos?","palavras de outras línguas incorporadas ao português (abajur, de abat-jour; delivery, shopping)"]],"lp7":[["Fale em voz alta tudo o que você lembra deste assunto","Classes: substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção, interjeição. Uma mesma palavra muda de classe conforme o uso (que, se, como, mais). Estude pronomes (pessoais, relativos, demonstrativos), tempos e modos verbais, vozes e conjunções."],["Classes?","substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção, interjeição"]],"lp8":[["Fale em voz alta tudo o que você lembra deste assunto","Sujeito, predicado, objetos, adjuntos, complementos. Período composto: coordenação e subordinação. Vírgula: não separa sujeito de verbo nem verbo de complemento; separa aposto, vocativo, adjunto deslocado e oração explicativa. Estude ainda ponto e vírgula, dois-pontos, travessão e aspas, além de concordância, regência e crase."],["Período composto?","coordenação e subordinação"],["Vírgula?","não separa sujeito de verbo nem verbo de complemento; separa aposto, vocativo, adjunto deslocado e oração explicativa"]],"lp9":[["Fale em voz alta tudo o que você lembra deste assunto","Variação diacrônica (tempo), diatópica (região), diastrática (grupo social) e diafásica (situação). Norma-padrão x norma culta x registro informal. Nenhuma variedade é errada: o que se avalia é a adequação à situação comunicativa. Cuidado com o preconceito linguístico."],["Nenhuma variedade é errada?","o que se avalia é a adequação à situação comunicativa"]],"lp10":[["Fale em voz alta tudo o que você lembra deste assunto","Denotação: sentido literal, de dicionário. Conotação: sentido figurado. Figuras: metáfora, metonímia, comparação, ironia, hipérbole, eufemismo, antítese, paradoxo, personificação. A questão costuma dar uma expressão e pedir o sentido em que está usada."],["Denotação?","sentido literal, de dicionário"],["Conotação?","sentido figurado"],["Figuras?","metáfora, metonímia, comparação, ironia, hipérbole, eufemismo, antítese, paradoxo, personificação"]],"lp11":[["Fale em voz alta tudo o que você lembra deste assunto","Acordo Ortográfico de 1990: alfabeto com k, w, y; trema eliminado (exceto em nomes estrangeiros); sem acento em ditongos abertos ei/oi de paroxítonas (ideia, heroico); sem acento em hiatos oo e ee (voo, leem); fim do acento diferencial em pára e pelo. Hífen: use com h (anti-herói), com vogais iguais em prefixo que termina na mesma vogal (micro-ondas) e não use antes de s ou r duplicados (antirrábico, ultrassom)."],["Acordo Ortográfico de 1990?","alfabeto com k, w, y; trema eliminado (exceto em nomes estrangeiros); sem acento em ditongos abertos ei/oi de paroxítonas (ideia, heroico); sem acento em hiatos oo e ee (voo, leem); fim do acento diferencial em pára e pelo"],["Hífen?","use com h (anti-herói), com vogais iguais em prefixo que termina na mesma vogal (micro-ondas) e não use antes de s ou r duplicados (antirrábico, ultrassom)"]],"rlm0":[["Fale em voz alta tudo o que você lembra deste assunto","Proposição é sentença declarativa que pode ser V ou F. Conectivos: negação (~), e (só é V se ambas forem V), ou (só é F se ambas forem F), se...então (só é F quando V é seguido de F), se e somente se (V quando os valores são iguais). Tabela-verdade tem 2^n linhas. Negação do “e”: nega as duas e troca por ou (De Morgan). Negação de se p então q: p e não q."],["Proposição é sentença declarativa que pode ser V ou F. Conectivos?","negação (~), e (só é V se ambas forem V), ou (só é F se ambas forem F), se...então (só é F quando V é seguido de F), se e somente se (V quando os valores são iguais)"],["Negação do “e”?","nega as duas e troca por ou (De Morgan)"]],"rlm1":[["Fale em voz alta tudo o que você lembra deste assunto","Equivalências essenciais: (se p então q) = (se não q então não p) = (não p ou q). Bicondicional = ida e volta. Dupla negação. Negação de Todo A é B: Algum A não é B. Negação de Nenhum A é B: Algum A é B."],["Equivalências essenciais?","(se p então q) = (se não q então não p) = (não p ou q)"],["Negação de Todo A é B?","Algum A não é B. Negação de Nenhum A é B: Algum A é B"]],"rlm2":[["Fale em voz alta tudo o que você lembra deste assunto","Monte tabela de dupla entrada, marque as certezas e elimine possibilidades. Comece pelas afirmações mais categóricas. Em problemas de verdade e mentira, suponha quem mente e teste contradições. Anote tudo em esquemas."]],"rlm3":[["Fale em voz alta tudo o que você lembra deste assunto","Diagramas de Venn representam Todo, Algum e Nenhum. Em tabelas e gráficos, leia título, unidades e escala; calcule variações percentuais, médias e proporções. Cuidado com pegadinhas de escala."]],"rlm4":[["Fale em voz alta tudo o que você lembra deste assunto","Operações: união, interseção, diferença, complementar. n(A união B) = n(A) + n(B) - n(A interseção B). Para três conjuntos use inclusão e exclusão. Número de subconjuntos de um conjunto com n elementos: 2^n. Diferencie pertinência (elemento) de inclusão (conjunto)."],["Operações?","união, interseção, diferença, complementar. n(A união B) = n(A) + n(B) - n(A interseção B)"]],"rlm5":[["Fale em voz alta tudo o que você lembra deste assunto","N dentro de Z, dentro de Q, dentro de R. Domine frações, MMC e MDC, dízimas periódicas e fração geratriz, potências, raízes, regra de sinais e ordem das operações (parênteses, potências, multiplicação/divisão, soma/subtração)."]],"rlm6":[["Fale em voz alta tudo o que você lembra deste assunto","Ordem de números na reta, módulo como distância até a origem, intervalos abertos e fechados, comparação de frações e decimais, números negativos."]],"rlm7":[["Fale em voz alta tudo o que você lembra deste assunto","Distância: km, m, cm, mm. Massa: t, kg, g, mg (1 t = 1000 kg). Tempo: h, min, s. Velocidade média = distância/tempo; km/h para m/s divide por 3,6. Converta sempre antes de calcular."],["Distância?","km, m, cm, mm"],["Massa?","t, kg, g, mg (1 t = 1000 kg)"]],"rlm8":[["Fale em voz alta tudo o que você lembra deste assunto","Pontos como pares (x, y), quadrantes, distância entre pontos = raiz de ((x2-x1)^2 + (y2-y1)^2), ponto médio = média das coordenadas. Leitura de gráficos no plano."]],"rlm9":[["Fale em voz alta tudo o que você lembra deste assunto","Equação do 1º grau ax + b = 0. Sistemas: substituição e adição. Traduza o enunciado em equação (idades, dinheiro, torneiras). Sempre teste a resposta no enunciado."],["Sistemas?","substituição e adição"]],"rlm10":[["Fale em voz alta tudo o que você lembra deste assunto","p% de x = p/100 vezes x. Aumento: multiplica por (1 + i); desconto: por (1 - i); variações sucessivas se multiplicam (nunca somam). Regra de três simples e composta, direta e inversa. Razão, proporção e divisão proporcional."],["Aumento?","multiplica por (1 + i); desconto: por (1 - i); variações sucessivas se multiplicam (nunca somam)"]],"rlm11": o que você lembra deste assunto","Processo penal constitucional: devido processo legal, presunção de inocência, contraditório e ampla defesa, juiz natural, vedação de provas ilícitas, publicidade, duração razoável. O processo penal se interpreta à luz da Constituição."],["Processo penal constitucional?","devido processo legal, presunção de inocência, contraditório e ampla defesa, juiz natural, vedação de provas ilícitas, publicidade, duração razoável"]],"dpp25":[["Fale em voz alta tudo o que você lembra deste assunto","Sistemas: inquisitivo, acusatório e misto. O Brasil adota o sistema acusatório (art. 3º-A do CPP). Princípios: contraditório, ampla defesa, presunção de inocência, in dubio pro reo, oralidade, publicidade, imparcialidade do juiz, identidade física do juiz."],["Sistemas?","inquisitivo, acusatório e misto"],["Princípios?","contraditório, ampla defesa, presunção de inocência, in dubio pro reo, oralidade, publicidade, imparcialidade do juiz, identidade física do juiz"]],"dpp26":[["Fale em voz alta tudo o que você lembra deste assunto","Lei processual penal tem aplicação imediata (art. 2º CPP), sem prejuízo dos atos já praticados. Territorialidade (art. 1º) com exceções (tratados, imunidades). Foro por prerrogativa de função. Estude os arts. 1º a 3º do CPP."]],"dpp27":[["Fale em voz alta tudo o que você lembra deste assunto","Inquérito policial: procedimento administrativo, inquisitivo, escrito, sigiloso e dispensável; presidido pelo delegado. Instauração: de ofício, por requisição do juiz ou MP, ou requerimento do ofendido. Prazo: 10 dias com réu preso; 30 dias solto (prorrogável). Arquivamento. Juiz das garantias."],["Inquérito policial?","procedimento administrativo, inquisitivo, escrito, sigiloso e dispensável; presidido pelo delegado"],["Instauração?","de ofício, por requisição do juiz ou MP, ou requerimento do ofendido"],["Prazo?","10 dias com réu preso; 30 dias solto (prorrogável)"]],"dpp28":[["Fale em voz alta tudo o que você lembra deste assunto","Relação processual: juiz, autor e réu. Procedimentos comum (ordinário, sumário, sumaríssimo) e especiais. Pretensão punitiva: direito do Estado de punir (jus puniendi). Princípios gerais: devido processo, verdade, economia processual."],["Relação processual?","juiz, autor e réu"],["Pretensão punitiva?","direito do Estado de punir (jus puniendi)"],["Princípios gerais?","devido processo, verdade, economia processual"]],"dpp29":[["Fale em voz alta tudo o que você lembra deste assunto","Ação penal pública: incondicionada (regra) ou condicionada à representação ou à requisição do Ministro da Justiça; privada: queixa-crime. Princípios: obrigatoriedade, indisponibilidade, indivisibilidade, intranscendência. Prazo da denúncia: 5 dias (preso) e 15 (solto). Queixa: decadência em 6 meses. Requisitos da denúncia (art. 41)."],["Ação penal pública?","incondicionada (regra) ou condicionada à representação ou à requisição do Ministro da Justiça; privada: queixa-crime"],["Princípios?","obrigatoriedade, indisponibilidade, indivisibilidade, intranscendência"],["Prazo da denúncia?","5 dias (preso) e 15 (solto)"],["Queixa?","decadência em 6 meses"]],"dpp30":[["Fale em voz alta tudo o que você lembra deste assunto","Sujeitos: juiz, Ministério Público, acusado, defensor, assistente de acusação, auxiliares da Justiça e peritos. Impedimento e suspeição do juiz. Interrogatório como meio de defesa. Direito ao silêncio."],["Sujeitos?","juiz, Ministério Público, acusado, defensor, assistente de acusação, auxiliares da Justiça e peritos"]],"dpp31":[["Fale em voz alta tudo o que você lembra deste assunto","Lei 9.099/95: infração de menor potencial ofensivo (pena máxima até 2 anos). Termo circunstanciado, composição civil dos danos, transação penal e suspensão condicional do processo (pena mínima até 1 ano). Princípios: oralidade, simplicidade, informalidade, economia processual e celeridade. Lei 10.259/01: Juizados Federais."],["Lei 9.099/95?","infração de menor potencial ofensivo (pena máxima até 2 anos)"],["Princípios?","oralidade, simplicidade, informalidade, economia processual e celeridade"],["Lei 10.259/01?","Juizados Federais"]],"dpp32":[["Fale em voz alta tudo o que você lembra deste assunto","Contagem: exclui o dia do início e inclui o do vencimento (art. 798 CPP). Prazos penais contínuos e peremptórios: não se interrompem por férias, domingo ou feriado. Se o último dia cair em domingo ou feriado, prorroga-se. Diferencie prazo processual de prazo penal (que inclui o dia do começo)."],["Contagem?","exclui o dia do início e inclui o do vencimento (art. 798 CPP)"],["Prazos penais contínuos e peremptórios?","não se interrompem por férias, domingo ou feriado"]],"dpp33":[["Fale em voz alta tudo o que você lembra deste assunto","Nulidades absolutas e relativas. Princípios: prejuízo (sem prejuízo não há nulidade), instrumentalidade das formas, convalidação. Art. 564 do CPP lista causas. Nulidade relativa precisa ser arguida no momento oportuno, senão preclui. Provas ilícitas e derivadas (frutos da árvore envenenada)."],["Princípios?","prejuízo (sem prejuízo não há nulidade), instrumentalidade das formas, convalidação"]],"dpp34":[["Fale em voz alta tudo o que você lembra deste assunto","Estude as súmulas mais cobradas: Súmula Vinculante 11 (algemas só em caso de resistência, fuga ou perigo, com justificativa por escrito), Súmula Vinculante 14 (acesso do advogado às provas já documentadas), Súmula 444 do STJ (inquéritos e ações em curso não agravam a pena-base), Súmula 145 do STF (não há crime quando a preparação do flagrante o torna impossível)."]],"adm0":[["Fale em voz alta tudo o que você lembra deste assunto","Administração é o processo de planejar, organizar, dirigir e controlar recursos para atingir objetivos. Eficiência: fazer certo; eficácia: alcançar resultados. Evolução: Taylor, Fayol, Weber, Mayo, abordagens modernas."],["Eficiência?","fazer certo; eficácia: alcançar resultados"],["Evolução?","Taylor, Fayol, Weber, Mayo, abordagens modernas"]],"a
